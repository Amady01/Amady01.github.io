#
# Site Settings
#

# Nom affiché
name: Amadou SALL

# Sous-titre plus professionnel
description: >
  Data & AI Specialist | Statistical Dissemination Expert |
  Open Data • Data Management • Visualization • Official Statistics

# Photo profil
avatar: https://avatars.githubusercontent.com/u/152607090?v=4&size=200

#
# Personal Branding
#

title: "Data & AI Portfolio"
tagline: "Transforming data into insights and impactful decisions"

#
# Social / Footer Links
#

footer-links:
  email: amadymail01@gmail.com
  github: amady01
  linkedin: amadou-sall-29b5802aa
  twitter:
  youtube:
  instagram:
  facebook:
  rss: yes

#
# SEO & Metadata
#

author: Amadou SALL
lang: fr
timezone: Africa/Dakar

keywords:
  - Data Science
  - Artificial Intelligence
  - Open Data
  - Statistical Dissemination
  - Power BI
  - Data Visualization
  - SDMX
  - Official Statistics
  - Python
  - Data Management

#
# Analytics (à compléter si besoin)
#

google_analytics:

#
# Website URL
#

url: "https://amady01.github.io"
baseurl: ""

#
# Navigation / UX Improvements
#

show_excerpts: true

paginate: 5
paginate_path: "/page:num/"

permalink: /:title/

#
# Jekyll Settings
#

version: v1.2.0

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

#
# Collections
#

collections:
  projects:
    output: true
  publications:
    output: true

#
# Defaults
#

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"

#
# Exclusions
#

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
